experiment:
  id: "check_tuna_box"
  repetitions: 2

data:
  # the body series of the dump, split out by scripts/to_dicom_folders.py
  input_path: "data/raw/DD2210_Blue_Tuna/02_CUERPO_CUERPO_7_0"
  reference_mask_path: "data/reference_masks/DD2210_Bluefin_Tuna/Series_3_segmentation.nii.gz"
  format: "dicom"
  # the bounding box of the mask grown by 25% (mm from the first voxel, [z, y, x]) and its deepest voxel
  box:
    min_mm: [199.5, 124.17, 185.42]
    max_mm: [567, 234.08, 307.07]
  seed_zyx: [84, 206, 285]

algorithm:
  name: "box_region"
  parameters: {}

mesh:
  smoothing_iterations: 5
  decimation_factor: 0.2
  output_format: "glb"

output:
  results_dir: "results/"
