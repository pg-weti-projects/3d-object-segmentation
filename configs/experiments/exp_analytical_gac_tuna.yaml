experiment:
  id: "exp_gac_tuna"
  description: "Geodesic active contour on DD2210 Bluefin tuna (series 3), inside the box, started from a ball around the seed"
  seed: 42
  repetitions: 2

data:
  input_path: "data/raw/DD2210_Bluefin_Tuna/DD2210_Bluefin_Tuna_series3.nii.gz"
  reference_mask_path: "data/reference_masks/DD2210_Bluefin_Tuna/Series_3_segmentation.nii.gz"
  format: "nifti"
  box:
    min_mm: [196, 116, 175]
    max_mm: [581, 237, 310]
  seed_zyx: [131, 231, 330]

algorithm:
  name: "geodesic_active_contour"
  parameters:
    init_from: "seed_ball"
    domain_size_mm: 350.0
    hu_range: [-1000, 400]

mesh:
  smoothing_iterations: 5
  decimation_factor: 0.2
  output_format: "glb"

output:
  results_dir: "results/"
