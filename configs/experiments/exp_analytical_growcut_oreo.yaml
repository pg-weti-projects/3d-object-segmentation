experiment:
  id: "exp_growcut_oreo"
  description: "Analytical (GrowCut, 3D cellular automaton) on Oreo_fish"
  seed: 42
  repetitions: 3

data:
  input_path: "data/raw/Oreo_fish/density"
  reference_mask_path: "data/reference_masks/Oreo_fish/Segmentation.nii.gz"
  format: "dicom"

preprocessing:
  target_spacing: [1.0, 1.0, 1.0]
  hu_range: [-1000, 200]
  invert_hu: false
  denoise: true

algorithm:
  name: "growcut"
  parameters:
    domain_size_mm: 80.0
    compute_spacing_mm: 0.5
    fg_radius_mm: 3.0
    bg_radius_mm: null
    neighborhood: "von_neumann"
    max_iterations: 1000
    smooth_t1: null
    smooth_t2: null

mesh:
  algorithm: "marching_cubes"
  smoothing_iterations: 15
  decimation_factor: 0.2
  output_format: "glb"

output:
  results_dir: "results/"
