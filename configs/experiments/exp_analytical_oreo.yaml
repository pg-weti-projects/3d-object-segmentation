experiment:
  id: "exp_chan_vese_oreo"
  description: "Improved Chan-Vese on Oreo_fish, inside the box, started from the measured contrast"
  seed: 42
  repetitions: 2

data:
  input_path: "data/raw/Oreo_fish/density"
  reference_mask_path: "data/reference_masks/Oreo_fish/Segmentation.nii.gz"
  format: "dicom"
  # the same box and the same seed point as check_oreo_box, so the methods are comparable
  box:
    min_mm: [0, 147, 15]
    max_mm: [165, 207, 48]
  seed_zyx: [17, 59, 10]

algorithm:
  name: "chan_vese"
  parameters:
    init_from: "contrast"  # start from the measured contrast, not from a ball around the seed

mesh:
  smoothing_iterations: 5
  decimation_factor: 0.2
  output_format: "glb"

output:
  results_dir: "results/"
