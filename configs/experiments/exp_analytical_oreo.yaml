experiment_id: exp_analytical_oreo

input:
  path: data/raw/Oreo_fish/density
  format: dicom

model:
  name: analytical
  params:
    threshold_method: otsu

preprocessing:
  target_spacing: [1.0, 1.0, 1.0]
  hu_range: [-1000, 200]
  invert_hu: false
  denoise: true

mesh:
  smooth: true
  smooth_iterations: 10
  decimate_ratio: 0.5
  export_formats: [glb, stl]

reference_mask:
  path: data/reference_masks/Oreo_fish/Segmentation.nii.gz

seed: 42
repeats: 3
