experiment:
  id: "sam_med3d_tuna"
  description: "SAM-Med3D: one click in a 3D box; the cube is scaled to the box and shows the scan around it"
  repetitions: 1

data:
  # needs the DICOM loader to keep the slice order along the slice normal: until then this series loads
  # mirrored in z against the mask, and the box, seed and metrics are wrong
  input_path: "data/raw/DD2210_Blue_Tuna/DD2210_dicom/02_CUERPO_CUERPO_7_0"
  reference_mask_path: "data/reference_masks/DD2210_Bluefin_Tuna/Series_3_segmentation.nii.gz"
  format: "dicom"
  # box around the bladder, limited in z as well (mm from the first voxel, [z, y, x]), and a voxel inside it
  box:
    min_mm: [199.5, 124.17, 185.42]
    max_mm: [567, 234.08, 307.07]
  seed_zyx: [84, 206, 285]

algorithm:
  name: "sam_med3d"
  parameters: {}  # threshold 0.5, intensity_shift "auto"

mesh:
  smoothing_iterations: 5
  decimation_factor: 0.2
  output_format: "glb"

output:
  results_dir: "results/"
