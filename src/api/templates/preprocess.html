<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volume Preprocessing</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{{ url_for('web.index') }}">3D Segmentation</a>
      <div class="navbar-nav">
        <a class="nav-link" href="{{ url_for('web.index') }}">Home</a>
        <a class="nav-link active" href="{{ url_for('web.preprocess_page') }}">Volume Preprocessing</a>
      </div>
    </div>
  </nav>
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="mb-4">
          <h1 class="fw-bold">Load and preprocess a volume</h1>
          <p class="text-secondary">Configure the preprocessing pipeline for your volumetric data.</p>
        </div>
        {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
        <div class="card border-0 shadow-sm">
          <div class="card-body p-4">
            <form method="post" action="{{ url_for('web.process') }}" enctype="multipart/form-data">
              <div class="mb-4">
                <label class="form-label fw-semibold" for="volume">Input file(s)</label>
                <input class="form-control" type="file" id="volume" name="volume" multiple required>
                <div class="form-text">Supported: JSON voxels, TIFF, and DICOM. Select multiple DICOM slices for a series.</div>
              </div>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label" for="target_spacing">Target spacing (Z, Y, X)</label>
                  <input class="form-control" type="text" id="target_spacing" name="target_spacing" value="1,1,1">
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="hu_range">HU range (min, max)</label>
                  <input class="form-control" type="text" id="hu_range" name="hu_range" value="-1000,200">
                </div>
              </div>
              <div class="mt-4">
                <div class="form-check mb-2">
                  <input class="form-check-input" type="checkbox" id="invert_hu" name="invert_hu">
                  <label class="form-check-label" for="invert_hu">Invert HU values</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="denoise" name="denoise" checked>
                  <label class="form-check-label" for="denoise">Enable denoising</label>
                </div>
              </div>
              <button class="btn btn-primary mt-4" type="submit">Process volume</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
